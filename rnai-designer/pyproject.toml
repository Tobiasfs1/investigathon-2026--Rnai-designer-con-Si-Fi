[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnai-designer"
version = "0.3.0"
description = "Importación descriptiva y trazable de resultados si-Fi"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rnai-designer = "rnai_designer.__main__:main"

[tool.setuptools.packages.find]
include = ["rnai_designer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: usa ejecutables Bowtie locales e índices sintéticos temporales"]
